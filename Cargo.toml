[package]
name = "weather-companion"
version = "0.1.0"
edition = "2021"
authors = ["Weather Companion Contributors"]
description = "Add small cities and unsupported locations to GNOME Weather"
license = "GPL-3.0-or-later"

[[bin]]
name = "weather-companion"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", features = ["v1_4"] }
glib = "0.20"
gio = { version = "0.20", features = ["v2_74"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
geo = "0.28"
once_cell = "1"

[features]
default = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
